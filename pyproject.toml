[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidden-memory"
version = "0.1.0"
description = "Auditable reference implementation of the hidden learning memory protocol"
requires-python = ">=3.11"
dependencies = [
    "numba>=0.61,<1",
    "numpy>=2.0,<3",
]

[project.scripts]
hidden-memory = "hidden_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
analysis = [
    "matplotlib>=3.9,<4",
]
